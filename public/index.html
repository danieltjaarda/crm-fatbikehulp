// ---------- overzicht ----------
const dagSleutel = (t) => { const d = new Date(t); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); };
/** Omzet en aantal bestellingen per dag over de laatste n dagen (vandaag meegeteld), en de n dagen daarvoor als vergelijking. */
function statistiek(n) {
  const nu = new Date(), j = nu.getFullYear(), m = nu.getMonth(), d = nu.getDate();
  const dagen = [], index = new Map();
  for (let i = n - 1; i >= 0; i--) { const b = { dag: new Date(j, m, d - i), omzet: 0, aantal: 0 }; dagen.push(b); index.set(dagSleutel(b.dag), b); }
  const begin = dagen[0].dag.getTime(), vorigBegin = new Date(j, m, d - (2 * n - 1)).getTime();
  const vorig = { omzet: 0, aantal: 0 }, producten = new Map(), winkels = new Map();
  for (const o of staat.orders) {
    if (!inWinkel(o) || !teltMee(o)) continue;
    const t = orderMoment(o);
    if (!t) continue;
    const bedrag = Number(o.amount) || 0, b = index.get(dagSleutel(t));
    if (b) {
      b.omzet += bedrag; b.aantal++;
      for (const i of o.items || []) {
        const naam = String(i.name || "").trim();
        if (!naam) continue;
        const p = producten.get(naam) || { naam, aantal: 0, omzet: 0 }, q = Number(i.quantity) || 1;
        p.aantal += q; p.omzet += (Number(i.price) || 0) * q; producten.set(naam, p);
      }
      const w = winkelVan(o), x = winkels.get(w) || { naam: winkelNaam(w), aantal: 0, omzet: 0 };
      x.aantal++; x.omzet += bedrag; winkels.set(w, x);
    } else if (t >= vorigBegin && t < begin) { vorig.omzet += bedrag; vorig.aantal++; }
  }
  const cent = (x) => Math.round(x * 100) / 100;
  dagen.forEach((b) => (b.omzet = cent(b.omzet)));
  return { dagen, omzet: cent(dagen.reduce((s, b) => s + b.omzet, 0)), aantal: dagen.reduce((s, b) => s + b.aantal, 0), vorig: { omzet: cent(vorig.omzet), aantal: vorig.aantal },
    producten: [...producten.values()].sort((a, b) => b.aantal - a.aantal || b.omzet - a.omzet).slice(0, 5), winkels: [...winkels.values()].sort((a, b) => b.omzet - a.omzet) };
}
// Verschil met de periode ervoor: pijl en percentage in kleur, het vergelijkingsgetal ernaast in gewone tekst.
function verschil(nu, vorig, tov, opmaak) {
  let chip = "";
  if (vorig > 0) {
    const pct = ((nu - vorig) / vorig) * 100, rond = Math.round(Math.abs(pct));
    const soort = rond === 0 ? "gelijk" : pct > 0 ? "op" : "neer";
    chip = '<span class="delta ' + soort + '" title="' + (soort === "op" ? "gestegen" : soort === "neer" ? "gedaald" : "gelijk gebleven") + '">' + (soort === "gelijk" ? "" : ic(soort)) + (rond > 999 ? "999+" : rond) + "%</span>";
  }
  return chip + "<span>" + tov + " " + esc(opmaak(vorig)) + "</span>";
}
const tegel = (label, waarde, sub, link) => (link ? '<a class="tegel" ' + link + ">" : '<div class="tegel">') + '<div class="tegel-label"><span>' + label + "</span>" + (link ? ic("rechts") : "") + '</div><div class="tegel-waarde">' + waarde + '</div><div class="tegel-sub">' + (sub || "") + "</div>" + (link ? "</a>" : "</div>");
const dagNaam = (d) => d.toLocaleDateString("nl-NL", { weekday: "short", day: "numeric", month: "long" });
const aantalBestellingen = (n) => getal(n) + (n === 1 ? " bestelling" : " bestellingen");

function paginaOverzicht() {
  const n = staat.periode, vandaag = statistiek(1), s = statistiek(n), tv = teVerzenden();
  staat.dagen = s.dagen;
  const gem = (x) => (x.aantal ? x.omzet / x.aantal : 0);
  const ervoor = n + " dagen ervoor", periode = '<span class="sub">laatste ' + n + " dagen</span>";
  const maxP = Math.max(1, ...s.producten.map((p) => p.aantal)), maxW = Math.max(1, ...s.winkels.map((w) => w.omzet));
  // Ranglijst: naam en cijfer op één regel, daaronder een dunne balk vanaf dezelfde beginlijn.
  const rang = (rijen) => '<div class="rang">' + rijen.map(([naam, cijfer, deel]) => '<div><div class="rang-kop"><span class="rang-naam">' + naam + '</span><span class="rang-cijfer">' + cijfer + '</span></div><div class="rang-staaf" style="width:' + Math.max(1, Math.round(deel * 100)) + '%"></div></div>').join("") + "</div>";
  return kop("Overzicht", esc(new Date().toLocaleDateString("nl-NL", { weekday: "long", day: "numeric", month: "long", year: "numeric" }))) +
    '<div class="tegels">' +
    tegel("Te verzenden", getal(tv.length), tv.length ? "oudste van " + esc(wanneer(tv[tv.length - 1].createdAt).toLowerCase()) : "Alles is de deur uit", 'href="#/bestellingen" data-ga-filter="nieuw"') +
    tegel("Omzet vandaag", esc(euro(vandaag.omzet)), verschil(vandaag.omzet, vandaag.vorig.omzet, "gisteren", euro)) +
    tegel("Bestellingen vandaag", getal(vandaag.aantal), verschil(vandaag.aantal, vandaag.vorig.aantal, "gisteren", getal)) + "</div>" +
    (tv.length ? '<div class="kaart"><div class="kaartkop"><h2>Te verzenden</h2><a href="#/bestellingen" data-ga-filter="nieuw">' + (tv.length > 5 ? "Alle " + getal(tv.length) + " bekijken" : "Naar bestellingen") + ic("rechts") + "</a></div>" + orderTabel(tv.slice(0, 5), true) + "</div>" : "") +
    '<div class="sectiekop"><h2>Verkoop</h2><div class="segment" role="group" aria-label="Periode">' + [7, 30, 90].map((d) => '<button data-periode="' + d + '"' + (d === n ? ' class="aan" aria-pressed="true"' : ' aria-pressed="false"') + ">" + d + " dagen</button>").join("") + "</div></div>" +
    '<div class="tegels">' + tegel("Omzet", esc(euro(s.omzet)), verschil(s.omzet, s.vorig.omzet, ervoor, euro)) + tegel("Bestellingen", getal(s.aantal), verschil(s.aantal, s.vorig.aantal, ervoor, getal)) + tegel("Gemiddelde orderwaarde", esc(euro(gem(s))), verschil(gem(s), gem(s.vorig), ervoor, euro)) + "</div>" +
    '<div class="kaart"><div class="kaartkop"><h2>Omzet per dag' + periode + '</h2><button class="knop licht" id="g-wissel">' + (staat.grafiekTabel ? "Grafiek" : "Tabel") + "</button></div>" +
    (staat.grafiekTabel ? '<div class="g-tabel"><table class="tabel"><thead><tr><th>Dag</th><th class="num">Bestellingen</th><th class="num">Omzet</th></tr></thead><tbody>' + s.dagen.slice().reverse().map((b) => "<tr><td>" + esc(dagNaam(b.dag)) + '</td><td class="num">' + getal(b.aantal) + '</td><td class="num">' + esc(euro(b.omzet)) + "</td></tr>").join("") + "</tbody></table></div>" : '<div class="grafiek" id="grafiek"></div>') + "</div>" +
    '<div class="twee-kol"><div class="kaart"><div class="kaartkop"><h2>Meest verkocht' + periode + "</h2></div>" +
    (s.producten.length ? rang(s.producten.map((p) => [esc(p.naam), "<b>" + getal(p.aantal) + "×</b> · " + esc(euro(p.omzet)), p.aantal / maxP])) : '<p class="zacht" style="margin:0">Nog niets verkocht in deze periode.</p>') + "</div>" +
    (meerWinkels() && s.winkels.length ? '<div class="kaart"><div class="kaartkop"><h2>Per winkel' + periode + "</h2></div>" + rang(s.winkels.map((w) => [esc(w.naam), "<b>" + esc(euro(w.omzet)) + "</b> · " + aantalBestellingen(w.aantal), w.omzet / maxW])) + "</div>" : "") + "</div>";
}

// Grafiek: één lijn met een lichte vulling. De breedte volgt de kaart; bij aanwijzen of met de
// pijltjestoetsen zie je de dag, de omzet en het aantal bestellingen. Dezelfde cijfers staan onder "Tabel".
function startGrafiek() {
  const el = $("#grafiek");
  let breedte = 0;
  const pas = () => { const b = Math.floor(el.clientWidth); if (b > 0 && b !== breedte) { breedte = b; tekenGrafiek(el, staat.dagen, b); } };
  pas();
  if (window.ResizeObserver) { grafiekKijker = new ResizeObserver(pas); grafiekKijker.observe(el); }
}
// Ronde stappen voor de as: 0, 200, 400 in plaats van 0, 113, 226.
function schaal(v) {
  if (!(v > 0)) return { max: 100, ticks: [0, 50, 100] };
  const ruw = v / 3, macht = Math.pow(10, Math.floor(Math.log10(ruw))), f = ruw / macht;
  const stap = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * macht;
  const max = Math.ceil(v / stap - 1e-9) * stap, ticks = [];
  for (let t = 0; t <= max + stap / 2; t += stap) ticks.push(Math.round(t * 100) / 100);
  return { max, ticks };
}
function tekenGrafiek(el, dagen, B) {
  const n = dagen.length, H = 250, L = 60, R = 14, T = 14, O = 28, pw = B - L - R, ph = H - T - O;
  const { max, ticks } = schaal(Math.max(...dagen.map((d) => d.omzet)));
  const x = (i) => L + (n === 1 ? pw / 2 : (i * pw) / (n - 1)), y = (v) => T + ph - (v / max) * ph;
  const asGetal = (v) => "€ " + (max >= 10000 ? getal(v / 1000) + "K" : getal(v));
  const pad = dagen.map((d, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(d.omzet).toFixed(1)).join(" ");
  // Zoveel datums onder de as als er naast elkaar passen, altijd met de eerste en de laatste dag.
  const stuks = Math.max(2, Math.min(n, Math.floor(pw / 96)));
  const plekken = n === 1 ? [0] : [...new Set(Array.from({ length: stuks }, (_, k) => Math.round((k * (n - 1)) / (stuks - 1))))];
  el.innerHTML = '<svg viewBox="0 0 ' + B + " " + H + '" width="' + B + '" height="' + H + '" tabindex="0" role="img" aria-label="Omzet per dag over de laatste ' + n + ' dagen. Met de pijltjestoetsen lees je de dagen één voor één.">' +
    ticks.map((t) => '<line class="' + (t ? "g-raster" : "g-basis") + '" x1="' + L + '" x2="' + (B - R) + '" y1="' + y(t) + '" y2="' + y(t) + '"/><text class="g-tekst" x="' + (L - 10) + '" y="' + y(t) + '" dy=".32em" text-anchor="end">' + asGetal(t) + "</text>").join("") +
    plekken.map((i, k) => '<text class="g-tekst" x="' + x(i) + '" y="' + (H - 6) + '" text-anchor="' + (n === 1 ? "middle" : k === 0 ? "start" : k === plekken.length - 1 ? "end" : "middle") + '">' + esc(dagen[i].dag.toLocaleDateString("nl-NL", { day: "numeric", month: "short" })) + "</text>").join("") +
    '<path class="g-vlak" d="' + pad + " L" + x(n - 1).toFixed(1) + " " + y(0) + " L" + x(0).toFixed(1) + " " + y(0) + ' Z"/><path class="g-lijn" d="' + pad + '"/>' +
    '<line class="g-kruis" y1="' + T + '" y2="' + y(0) + '" visibility="hidden"/><circle class="g-stip" r="5" cx="' + x(n - 1) + '" cy="' + y(dagen[n - 1].omzet) + '"/></svg>' +
    '<div class="g-tip" hidden><div class="g-tip-waarde"></div><div class="g-tip-label"></div></div>';
  const svg = el.querySelector("svg"), tip = el.querySelector(".g-tip"), kruis = el.querySelector(".g-kruis"), stip = el.querySelector(".g-stip");
  let actief = -1;
  const toon = (i) => {
    actief = Math.max(0, Math.min(n - 1, i));
    const d = dagen[actief], px = x(actief), py = y(d.omzet);
    kruis.setAttribute("x1", px); kruis.setAttribute("x2", px); kruis.setAttribute("visibility", "visible");
    stip.setAttribute("cx", px); stip.setAttribute("cy", py);
    tip.querySelector(".g-tip-waarde").textContent = euro(d.omzet);
    tip.querySelector(".g-tip-label").textContent = dagNaam(d.dag) + " · " + aantalBestellingen(d.aantal);
    tip.hidden = false;
    const tb = tip.offsetWidth, th = tip.offsetHeight, schaalX = el.clientWidth / B;
    // Boven het punt als daar ruimte is, anders ernaast, zodat de lijn zichtbaar blijft.
    const boven = py - th - 14 >= 0;
    const links = boven ? px * schaalX - tb / 2 : px * schaalX + 14 + tb > el.clientWidth ? px * schaalX - tb - 14 : px * schaalX + 14;
    tip.style.left = Math.max(0, Math.min(el.clientWidth - tb, links)) + "px";
    tip.style.top = (boven ? py - th - 14 : 0) + "px";
  };
  const verberg = () => { actief = -1; tip.hidden = true; kruis.setAttribute("visibility", "hidden"); stip.setAttribute("cx", x(n - 1)); stip.setAttribute("cy", y(dagen[n - 1].omzet)); };
  svg.addEventListener("pointermove", (e) => { const r = svg.getBoundingClientRect(); const px = (e.clientX - r.left) * (B / r.width); toon(n === 1 ? 0 : Math.round(((px - L) / pw) * (n - 1))); });
  svg.addEventListener("pointerleave", (e) => { if (e.pointerType === "mouse") verberg(); });
  svg.addEventListener("focus", () => { if (actief < 0) toon(n - 1); });
  svg.addEventListener("blur", verberg);
  svg.addEventListener("keydown", (e) => {
    const basis = actief < 0 ? n - 1 : actief;
    if (e.key === "ArrowLeft") { e.preventDefault(); toon(basis - 1); }
    else if (e.key === "ArrowRight") { e.preventDefault(); toon(basis + 1); }
    else if (e.key === "Home") { e.preventDefault(); toon(0); }
    else if (e.key === "End") { e.preventDefault(); toon(n - 1); }
  });
}

// ---------- het orderpaneel ----------
// Het paneel schuift van rechts in beeld; de blokken komen er kort na elkaar in.
let versTimer = null;
function openOrder(id) { staat.viaKlik = true; ga(staat.pagina || "overzicht", id); }
function toonOrder(id) {
  staat.open = id;
  // Een adres naar een bestelling die er niet (meer) is: terug naar de lijst.
  if (!staat.orders.some((x) => x.id === id)) { toast("Deze bestelling is niet gevonden"); sluit(true); return; }
  tekenPaneel();
  const p = $("#paneel");
  $("#p-rol").scrollTop = 0; p.classList.add("vers");
  clearTimeout(versTimer); versTimer = setTimeout(() => p.classList.remove("vers"), 800);
  // De pagina erachter staat stil zolang het paneel open is. De breedte van de schuifbalk
  // wordt aangevuld, zodat de pagina niet opzij springt.
  const schuifbalk = window.innerWidth - document.documentElement.clientWidth;
  document.body.style.paddingRight = schuifbalk > 0 ? schuifbalk + "px" : "";
  $("#scherm").classList.add("open"); document.body.classList.add("vast");
  laadLog();
}
// Bij het sluiten blijft de inhoud staan tot het paneel uit beeld is geschoven.
function verbergOrder() {
  staat.open = null; staat.viaKlik = false; clearTimeout(labelTimer);
  $("#scherm").classList.remove("open"); document.body.classList.remove("vast"); document.body.style.paddingRight = "";
  teken(); // de lijst erachter kan veranderd zijn
}
// Sluiten vanuit het scherm. Staat er nog iets niet-opgeslagen, dan eerst vragen.
async function sluit(zonderVragen) {
  if (!staat.open) return;
  if (!zonderVragen && vuil() && !(await vraag("Wijzigingen weggooien?", "Je hebt wijzigingen die nog niet zijn opgeslagen.", "Weggooien"))) return;
  if (staat.viaKlik) { staat.viaKlik = false; history.back(); }
  else { history.replaceState(null, "", "#/" + (staat.pagina || "overzicht")); route(); }
}
$("#scherm").onclick = (e) => { if (e.target.id === "scherm") sluit(); };

// Wat er in het formulier stond toen het werd getekend; wijkt het af, dan verschijnt de balk onderin.
let schoonFormulier = "";
function vuil() { return !!staat.open && !!$("#f-status") && JSON.stringify(formulier()) !== schoonFormulier; }
function werkVoetBij() { const v = $("#p-voet"); if (v) v.classList.toggle("toon", vuil()); }

function tekenPaneel() {
  const o = staat.orders.find((x) => x.id === staat.open);
  if (!o) return sluit(true);
  const a = o.shippingAddress || {};
  const s = statusVan(o);
  const veld = (id, label, w, type) => '<div class="veld"><label for="' + id + '">' + label + '</label><input id="' + id + '" type="' + (type || "text") + '" value="' + esc(w) + '"></div>';
  const uit = !kanMailen(o) ? " disabled" : "";
  const afzender = (staat.winkels[winkelVan(o)] || {}).afzender || "";
  // De inhoud rolt in een eigen vak; de balk met Opslaan staat eronder. Bij opnieuw tekenen
  // (na opslaan, of als de bot iets meldt) blijf je op dezelfde hoogte in het paneel.
  const plek = $("#p-rol") ? $("#p-rol").scrollTop : 0;
  $("#paneel").innerHTML =
    '<div class="p-rol" id="p-rol"><div class="p-kop"><div class="p-titel"><h2>' + esc(o.customerName || "Onbekende klant") + "</h2>" + pil(o) + '</div><button class="knop stil rond" id="dicht" aria-label="Sluiten" title="Sluiten (Esc)">' + ic("sluit") + "</button>" +
    '<div class="p-meta"><b>' + esc(euro(o.amount)) + "</b><span>" + esc(betaalTekst(o)) + (o.paymentMethod && o.paymentMethod !== "on_delivery" ? " · " + esc(o.paymentMethod) : "") + "</span><span>" + esc(tijd(o.createdAt)) + '</span><span class="mono">' + esc(o.id) + "</span>" + winkelTag(o) + "</div></div>" +
    '<div class="blok"><h3>Bestelling</h3>' + (o.items || []).map((i) => '<div class="item"><span>' + esc(i.quantity) + "× " + esc(i.name) + "</span><span>" + esc(euro((Number(i.price) || 0) * (Number(i.quantity) || 1))) + "</span></div>").join("") +
    (o.shippingCost ? '<div class="item"><span>Verzending' + (o.deliveryType ? " (" + esc(o.deliveryType) + ")" : "") + "</span><span>" + esc(euro(o.shippingCost)) + "</span></div>" : "") +
    (o.parcelShop && o.parcelShop.name ? '<div class="item"><span>Afhaalpunt: ' + esc(o.parcelShop.name) + "</span><span></span></div>" : "") +
    '<div class="item totaal"><span>Totaal</span><span>' + esc(euro(o.amount)) + "</span></div>" +
    (o.aanbetaald > 0 ? '<div class="item"><span>Aanbetaald</span><span>' + esc(euro(o.aanbetaald)) + "</span></div>" : "") +
    (o.openBijLevering > 0 ? '<div class="item"><span class="levering">Te betalen bij levering</span><span class="levering">' + esc(euro(o.openBijLevering)) + "</span></div>" : "") + "</div>" +
    oudBlok(o) +
    '<div class="blok"><h3>Afhandeling</h3><div class="twee"><div class="veld"><label for="f-status">Status</label><select id="f-status">' +
    (s === "open" ? '<option value="" selected>Niet betaald</option>' : "") + Object.entries(STATUS).map(([k, n]) => '<option value="' + k + '"' + (k === s ? " selected" : "") + ">" + n + "</option>").join("") + "</select></div>" +
    veld("f-tt", "Volgcode of volglink", o.trackTrace || "") + '</div><div class="veld" style="margin-bottom:0"><label for="f-not">Notitie (alleen voor jou)</label><textarea id="f-not">' + esc(o.notitie || "") + "</textarea></div></div>" +
    '<div class="blok" id="labelblok"></div>' +
    '<div class="blok"><h3>Klant</h3>' + veld("f-naam", "Naam", o.customerName || "") + '<div class="twee">' + veld("f-mail", "E-mail", o.customerEmail || "", "email") + veld("f-tel", "Telefoon", o.customerPhone || "", "tel") + "</div>" +
    '<div class="drie">' + veld("f-str", "Straat", a.street || a.streetAndNumber || "") + veld("f-nr", "Huisnummer", a.houseNumber || "") + '</div><div class="twee">' + veld("f-pc", "Postcode", a.postalCode || "") + veld("f-plaats", "Plaats", a.city || "") + "</div></div>" +
    '<div class="blok"><h3>Mail naar klant' + (kanMailen(o) && afzender ? "<small>vanaf " + esc(afzender) + "</small>" : "") + "</h3>" +
    (!kanMailen(o) ? '<p class="log" style="margin:0 0 10px">Mailen staat voor ' + esc(winkelNaam(winkelVan(o))) + " nog uit.</p>" : "") + '<div class="acties"><button class="knop licht" data-mail="bevestiging"' + uit + '>Bevestiging sturen</button><button class="knop licht" data-mail="verzonden"' + uit + '>Verzendbericht sturen</button></div>' +
    '<div class="veld" style="margin-top:14px"><label for="m-ond">Eigen bericht: onderwerp</label><input id="m-ond"></div><div class="veld"><label for="m-tekst">Bericht</label><textarea id="m-tekst" placeholder="De aanhef en afsluiting schrijf je zelf. De bestelling staat er automatisch onder."></textarea></div>' +
    '<button class="knop licht" data-mail="vrij"' + uit + ">Eigen bericht sturen</button>" +
    (o.mails && o.mails.length ? '<ul class="log">' + o.mails.slice().reverse().map((m) => "<li>" + esc(tijd(m.tijd)) + " · " + esc(MAILNAAM[m.soort] || m.soort) + (m.automatisch ? " (automatisch)" : "") + " naar " + esc(m.aan) + "</li>").join("") + "</ul>" : '<p class="log">Nog geen mail verstuurd vanuit de CRM.</p>') + "</div>" +
    '<div class="blok"><h3>Lijst</h3><div class="acties"><button class="knop licht" id="verberg">' + (o.verborgen ? "Terugzetten in de lijst" : "Verbergen uit de lijst") + '</button></div><p class="log">Een verborgen bestelling staat alleen nog onder Alles en telt niet mee in de omzet.</p></div>' +
    '<div class="blok" id="logblok"></div></div>' +
    '<div class="p-voet" id="p-voet"><div class="p-voet-in"><span>Niet-opgeslagen wijzigingen</span><div class="acties"><button class="knop licht" id="herstel">Ongedaan maken</button><button class="knop" id="opslaan">Opslaan</button></div></div></div>';
  $("#p-rol").scrollTop = plek;
  $("#dicht").onclick = () => sluit();
  $("#opslaan").onclick = () => lader("#opslaan", opslaan);
  $("#herstel").onclick = () => tekenPaneel();
  $("#verberg").onclick = () => lader("#verberg", () => stuur({ verborgen: !o.verborgen }, o.verborgen ? "Teruggezet" : "Verborgen"));
  document.querySelectorAll("#paneel [data-mail]").forEach((b) => (b.onclick = () => mail(b.dataset.mail, b)));
  schoonFormulier = JSON.stringify(formulier());
  $("#paneel").oninput = $("#paneel").onchange = werkVoetBij;
  tekenLabel();
  tekenLog();
  werkVoetBij();
  markeer();
}

// Wat het oude CRM (tot 14 okt 2026) over deze order wist: alleen ter informatie.
const OUDSTATUS = { nieuw: "nieuw", verwerkt: "verwerkt", verzonden: "verzonden", afgerond: "afgerond", geannuleerd: "geannuleerd" };
const BETAALSTATUS = { paid: "betaald", partially_refunded: "deels terugbetaald", refunded: "terugbetaald", chargeback: "chargeback loopt", chargeback_lost: "chargeback verloren", open: "open" };
const MELDING = { refund: "Terugbetaling", partial_refund: "Deels terugbetaald", chargeback: "Chargeback" };
const DISPUUT = { lost: "verloren", won: "gewonnen", needs_response: "reactie nodig", under_review: "in behandeling", warning_closed: "waarschuwing gesloten", warning_needs_response: "waarschuwing, reactie nodig", warning_under_review: "waarschuwing in behandeling" };
function oudBlok(o) {
  const c = o.oudCrm;
  if (!c) return "";
  const lijst = (titel, items) => items && items.length ? '<details><summary>' + esc(titel) + " (" + items.length + ")</summary><ul>" + items.join("") + "</ul></details>" : "";
  const link = (url, tekst) => /^https:\/\//i.test(url || "") ? '<a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(tekst) + "</a>" : esc(tekst);
  return '<div class="blok oud"><h3>Uit het oude CRM</h3><div>Ordernummer #' + esc(c.nummer) + (o.id !== c.id && c.id ? " (ook in de webshop)" : "") +
    " · status daar: " + esc(OUDSTATUS[c.status] || c.status) + " · betaling: " + esc(BETAALSTATUS[c.betaalstatus] || c.betaalstatus) + (c.handmatig ? " · handmatig ingevoerd" : "") + "</div>" +
    (c.aangenomen ? "<div>Stond daar nog op “" + esc(OUDSTATUS[c.status] || c.status) + "”. De order is betaald en ouder dan een maand, dus hier staat hij op Afgeleverd.</div>" : "") +
    (o.volgUrl && o.volgCode ? "<div>Volgcode: " + link(o.volgUrl, o.volgCode) + "</div>" : "") +
    (c.gewensteLeverdatum ? "<div>Gewenste leverdatum: " + esc(c.gewensteLeverdatum) + "</div>" : "") +
    (o.deliveryDate ? "<div>Verwachte levering bij bestellen: " + esc(o.deliveryDate) + "</div>" : "") +
    lijst("Betaalmeldingen", (c.betaalmeldingen || []).map((b) => "<li>" + esc(tijd(b.tijd)) + " · " + esc(MELDING[b.soort] || b.soort) + " " + esc(euro(b.bedrag)) + (b.status ? " · " + esc(DISPUUT[b.status] || b.status.replace(/_/g, " ")) : "") + (b.reden ? " · " + esc(b.reden.replace(/_/g, " ")) : "") + "</li>")) +
    lijst("Retouren", (c.retouren || []).map((r) => "<li>" + esc(tijd(r.tijd)) + " · " + esc((r.reden || "").replace(/_/g, " ")) + " · " + esc(r.afhandeling || r.status) + (r.trackTrace ? " · " + link(r.volgUrl, r.trackTrace) : "") + (r.notitie ? " · " + esc(r.notitie) : "") + "</li>")) +
    lijst("Statusgeschiedenis", (c.geschiedenis || []).map((h) => "<li>" + esc(tijd(h.tijd)) + " · " + esc(OUDSTATUS[h.status] || h.status) + (h.notitie ? " · " + esc(h.notitie) : "") + "</li>")) +
    lijst("Mails vanuit het oude CRM", (c.mails || []).map((m) => "<li>" + esc(tijd(m.tijd)) + " · " + esc(m.onderwerp) + " · naar " + esc(m.aan) + (m.mislukt ? " · <b>mislukt</b>" : "") + "</li>")) +
    "</div>";
}

function formulier() {
  const w = { trackTrace: $("#f-tt").value, notitie: $("#f-not").value, customerName: $("#f-naam").value, customerEmail: $("#f-mail").value, customerPhone: $("#f-tel").value,
    shippingAddress: { street: $("#f-str").value, houseNumber: $("#f-nr").value, postalCode: $("#f-pc").value, city: $("#f-plaats").value } };
  if ($("#f-status").value) w.verzendstatus = $("#f-status").value;
  return w;
}
async function stuur(wijzigingen, klaar) {
  try {
    const j = await api("/api/orders", { method: "PUT", body: { id: staat.open, wijzigingen } });
    staat.orders = staat.orders.map((x) => (x.id === j.order.id ? j.order : x));
    teken(); tekenPaneel(); toast(klaar || "Opgeslagen"); laadLog();
    return true;
  } catch (e) { toast(e.message); return false; }
}
function opslaan() { return stuur(formulier(), "Opgeslagen"); }

async function mail(soort, knop) {
  const o = staat.orders.find((x) => x.id === staat.open);
  // Onderwerp en bericht nu al vastpakken: bij het opslaan wordt het paneel opnieuw getekend.
  const body = { id: o.id, soort, onderwerp: $("#m-ond") ? $("#m-ond").value : "", tekst: $("#m-tekst") ? $("#m-tekst").value : "" };
  const zonderCode = soort === "verzonden" && !$("#f-tt").value.trim();
  if (!(await vraag(MAILNAAM[soort] + " sturen?", "Naar " + $("#f-mail").value + "." + (zonderCode ? "\nLet op: er is geen volgcode ingevuld." : ""), "Mail sturen"))) return;
  await lader('[data-mail="' + soort + '"]', async () => {
    // Eerst opslaan, zodat een net ingevulde volgcode of e-mailadres in de mail zit.
    if (!(await opslaan())) return;
    try {
      const j = await api("/api/mail", { method: "POST", body });
      staat.orders = staat.orders.map((x) => (x.id === j.order.id ? j.order : x));
      tekenPaneel(); toast("Mail verstuurd"); laadLog();
    } catch (e) {
      // Het eigen bericht terugzetten, zodat het niet opnieuw getypt hoeft te worden.
      if ($("#m-ond")) $("#m-ond").value = body.onderwerp; if ($("#m-tekst")) $("#m-tekst").value = body.tekst;
      toast(e.message);
    }
  });
}

// ---------- toetsen en vensterwissels ----------
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    const wk = $("#wk-menu"), schil = $("#schil");
    if (sluitVraag) sluitVraag(false);
    else if (wk && !wk.hidden) wk.hidden = true;
    else if (staat.open) sluit();
    else if (schil && schil.classList.contains("menuopen")) sluitMenu();
    return;
  }
  const inVeld = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName || "") || e.target.isContentEditable;
  // "/" springt naar het zoekveld, zoals in Stripe.
  if (e.key === "/" && !inVeld && !staat.open && !sluitVraag && !e.ctrlKey && !e.metaKey && !e.altKey && $("#zoek")) { e.preventDefault(); $("#zoek").focus(); $("#zoek").select(); }
  // Ctrl+S (of Cmd+S) slaat de open bestelling op.
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s" && staat.open) { e.preventDefault(); if (vuil()) lader("#opslaan", opslaan); }
});
// Klik buiten de winkelkeuze sluit hem.
document.addEventListener("click", (e) => { const m = $("#wk-menu"); if (m && !m.hidden && !e.target.closest("#wk")) m.hidden = true; });
// Kom je na een tijdje terug op dit tabblad, dan worden de gegevens ververst (niet als er een bestelling open staat).
document.addEventListener("visibilitychange", () => { if (!document.hidden && staat.ingelogd && !staat.open && Date.now() - staat.laatst > 2 * 60 * 1000) laad(); });

toonSkelet();
api("/api/login").then((j) => (j.ingelogd ? laad() : toonLogin())).catch(() => toonLogin());
</script>
